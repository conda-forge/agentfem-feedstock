context:
  name: agentfem
  version: "0.2.5"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 15e38851a501e6fcf8e365a601c801699b7b4c306c9bdcbce8ecfc841c6a5f1c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agentfem = agentfem.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - fenics-dolfinx
    - fenics-ufl
    - h5py
    - mpi4py
    - numpy
    - petsc4py

tests:
  - python:
      imports:
        - agentfem
        - agentfem.fields
        - agentfem.materials
        - agentfem.mesh
        - agentfem.operators
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import agentfem; assert agentfem.__version__ == '${{ version }}'"
      - agentfem doctor --json
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/haoming-luo/agentfem
  repository: https://github.com/haoming-luo/agentfem
  documentation: https://haoming-luo.github.io/agentfem/
  summary: AI-native finite-element computing for humans and agents.
  description: |
    AgentFEM is an open-source finite-element platform that turns engineering
    analyses into readable Python workflows shared by researchers, scripts,
    IDEs, future GUIs, and AI agents. It connects model definition, numerical
    solution, inspectable results, parameter campaigns, and learning-ready
    scientific data while retaining access to the FEniCSx/PETSc/MPI stack.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - haoming-luo
