context:
  name: agentfem
  version: "0.5.0"
  python_min: "3.11"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2797b5a8964eede28f9fbb99bd076d676852dabba5f84b24cf139a9bfc4d3cbb

build:
  number: 0
  noarch: python
  # AgentFEM's native accelerators are optional.  Keep the conda-forge
  # noarch package genuinely architecture-independent; platform wheels may
  # enable those accelerators separately.
  script: AGENTFEM_BUILD_NATIVE=0 ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agentfem = agentfem._cli_entry:main
      - agentfem-view = agentfem.viewer:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - fenics-dolfinx >=0.11,<0.12.0a0
    - fenics-ufl
    - h5py
    - matplotlib-base
    - mpi4py
    - numpy
    - packaging >=23
    - petsc4py
    - python-gmsh >=4.11
    - scipy >=1.11

tests:
  - python:
      imports:
        - agentfem
        - agentfem.fields
        - agentfem.materials
        - agentfem.mesh
        - agentfem.operators
        - gmsh
        - matplotlib
        - scipy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import agentfem; assert agentfem.__version__ == '${{ version }}'"
      - python -c "import dolfinx; assert dolfinx.__version__.startswith('0.11.')"
      - agentfem --help
      - agentfem-view --help
      - agentfem doctor --json
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/haoming-luo/agentfem
  repository: https://github.com/haoming-luo/agentfem
  documentation: https://haoming-luo.github.io/agentfem/
  summary: AI-native finite-element computing for humans and agents.
  description: |
    AgentFEM is an open-source finite-element platform that turns engineering
    analyses into readable Python workflows shared by researchers, scripts,
    IDEs, future GUIs, and AI agents. It connects model definition, numerical
    solution, inspectable results, parameter campaigns, and learning-ready
    scientific data while retaining access to the FEniCSx/PETSc/MPI stack.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - haoming-luo
